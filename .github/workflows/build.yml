name: Build and push image

on:
  push:
    branches: [ main ]      # constrói a cada push no main
  workflow_dispatch:         # e permite rodar manualmente pelo botão "Run workflow"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # necessário para publicar a imagem no GHCR
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Preparar QEMU (para construir também para ARM)
        uses: docker/setup-qemu-action@v3

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/ghisoof/stoat_bot:latest
