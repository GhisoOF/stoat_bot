# Um serviço só: bot + IA (+ voz opcional) no mesmo container.
services:
  stoat-bot:
    build: .
    # Ou use uma imagem publicada no lugar do build:
    # image: SEU_USUARIO/stoat-bot:latest
    container_name: stoat-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - TZ=America/Sao_Paulo
      # LLM externo (llama.cpp / llama-swap / Ollama, formato OpenAI):
      - LLM_URL=${LLM_URL:-http://host.docker.internal:8081}
      - LLM_MODEL=${LLM_MODEL:-}
      # Busca (SearXNG), se tiver:
      - SEARXNG_URL=${SEARXNG_URL:-}
      # Voz (opcional): VOZ_ATIVA=1 liga o serviço de voz dentro do container
      - VOZ_ATIVA=${VOZ_ATIVA:-0}
      # Super-admins (IDs separados por vírgula). Vazio = ninguém.
      - SUPER_ADMINS=${SUPER_ADMINS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - stoat_data:/data

volumes:
  stoat_data:
