# Um serviço só: bot + IA (+ voz opcional) no mesmo container.
services:
  stoat-bot:
    build: .
    # Ou use uma imagem publicada no lugar do build:
    # image: SEU_USUARIO/stoat-bot:latest
    container_name: stoat-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - TZ=${TZ:-America/Sao_Paulo}
      # ── Configuração amigável (veja .env.example) ──
      - DONO=${DONO:-}                # ID do perfil do dono do bot
      - SERVIDOR=${SERVIDOR:-}        # ID do servidor onde a IA roda ("*" = todos)
      - IA=${IA:-1}                   # 0 desliga todos os módulos de IA
      - IA_MODO=${IA_MODO:-}          # local | online (vazio = LLM_URL manual)
      - MODELO=${MODELO:-}            # local: repo:quant do HF · online: nome na plataforma
      - MODELO_VISAO=${MODELO_VISAO:-} # 2º modelo, multimodal (liga o llama-swap)
      - TOKEN_IA=${TOKEN_IA:-}        # token da plataforma (modo online)
      - PROMPT=${PROMPT:-}            # personalidade padrão da IA
      - IMAGEM=${IMAGEM:-1}           # 0 desliga a geração de imagem embutida
      # Voz nas calls: 1 liga (Piper na imagem; vozes baixam no 1º arranque)
      - VOZ_ATIVA=${VOZ_ATIVA:-0}
      - VOZ_CHAVE=${VOZ_CHAVE:-}   # senha do serviço de voz embutido (recomendado)
      - VOZES=${VOZES:-}           # vozes do Piper a baixar (ex.: pt_BR-faber-medium,pt_BR-dii-medium)
      # ── Avançado (têm prioridade sobre os amigáveis) ──
      - LLM_URL=${LLM_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - SUPER_ADMINS=${SUPER_ADMINS:-}
      - CHAT_SERVIDORES=${CHAT_SERVIDORES:-}
      - TTS_SERVIDORES=${TTS_SERVIDORES:-}
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - SD_URL=${SD_URL:-}            # A1111/Forge externo no lugar do embutido
      - SD_MODELO_URL=${SD_MODELO_URL:-}
      - GITHUB_REPO=${GITHUB_REPO:-}    # dono/repo que o ler_codigo lê do GitHub (vazio = lê o próprio código da imagem)
      - GITHUB_BRANCH=${GITHUB_BRANCH:-main}
      - CODIGO_DIR=${CODIGO_DIR:-}      # pasta local para o ler_codigo (vazio = o código da própria imagem)
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}  # só para ler repositório privado
      - LLAMA_NGL=${LLAMA_NGL:-999}     # camadas do modelo na GPU (IA_MODO=local)
      - LLAMA_CTX=${LLAMA_CTX:-8192}    # contexto do modelo local (tokens)
      - LLAMA_FLAGS=${LLAMA_FLAGS:-}    # flags extras do llama-server (ex.: --temp 1.0 --top-k 64)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # GPU para o modo local: descomente se a máquina tem GPU/iGPU com driver
    # Vulkan (Intel, AMD e a maioria das integradas). Sem isto, roda em CPU.
    #devices:
    #  - /dev/dri:/dev/dri
    #group_add:
    #  - video
    #  - render
    volumes:
      - stoat_data:/data

  # ── Busca na web da IA ──────────────────────────────────
  # Sobe junto por padrão: `docker compose up -d` traz tudo.
  # Para rodar SÓ o bot:  docker compose up -d stoat-bot
  searxng:
    image: searxng/searxng:latest
    container_name: stoat-searxng
    restart: unless-stopped
    volumes:
      - ./ia-servico/searxng-settings.example.yml:/etc/searxng/settings.yml:ro
      - searxng_data:/var/cache/searxng

volumes:
  stoat_data:
  searxng_data:
