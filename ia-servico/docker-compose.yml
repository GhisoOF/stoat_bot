# ── Serviço de IA da Judy (judy-ia) ───────────────────────
# Roda no COMPUTADOR, ao lado do Ollama.
#
# network_mode: host → o container usa a rede do host diretamente.
# Assim ele fala com o Ollama por localhost:11434, SEM passar pela
# rede do Docker (docker0/gateway) — o que evita o conflito UFW×Docker
# que trava o forwarding. A porta 8090 fica exposta na rede do host.
services:
  judy-ia:
    build: .
    # depois de publicar no GHCR, troque 'build: .' por:
    # image: ghcr.io/ghisoof/judy-ia:latest
    container_name: judy-ia
    restart: unless-stopped
    network_mode: host          # usa a rede do host (localhost = a própria máquina)
    # ── DNS ───────────────────────────────────────────────
    # NÃO monte /etc/resolv.conf aqui. Já foi tentado, e é justamente o
    # que causa o EAI_AGAIN depois de algumas horas rodando:
    #
    #   /etc/resolv.conf costuma ser um symlink para um arquivo que o
    #   systemd-resolved (e o Tailscale, ao reconectar) REESCREVE criando
    #   um arquivo novo e renomeando por cima. O bind-mount do Docker
    #   prende o INODE antigo, que depois disso não existe mais — o
    #   container fica olhando para um arquivo órfão e para de resolver
    #   nomes, mesmo com o host resolvendo normalmente. O sintoma clássico
    #   é "funcionava e parou sozinho", sem ninguém mexer em nada.
    #
    # Com network_mode: host o mount é dispensável: o Docker entrega o
    # resolv.conf do host ao container E o mantém atualizado quando o
    # arquivo do host muda. Deixar o Docker cuidar disso é o que faz o
    # DNS sobreviver a reinícios do resolved e do Tailscale.
    #
    # Se o DNS falhar mesmo assim, recrie (não só reinicie) o container:
    #   docker compose up -d --force-recreate judy-ia
    # e confira: docker exec judy-ia cat /etc/resolv.conf
    environment:
      # ── LLM (Ollama nativo, mesma máquina) ──
      # Com network_mode host, localhost é o próprio host.
      - OLLAMA_URL=http://localhost:11434
      - OLLAMA_MODEL=qwen3.5:9b          # PRECISA suportar tool calling (Gemma NÃO suporta)
      - NUM_CTX=16384
      - MAX_TOKENS=4096
      - PORTA=8090                        # porta do serviço (na rede do host)

      # ── Leitura do código via GitHub ──
      #
      # O token vem do arquivo .env AO LADO deste compose — nunca escrito aqui.
      # Motivo: este arquivo é versionado e sobrescrito a cada atualização; o
      # .env não é (está no .gitignore), então o token sobrevive aos deploys.
      #
      # Crie uma vez:  echo "GITHUB_TOKEN=github_pat_..." > .env
      #
      # É OBRIGATÓRIO para repositório privado — sem ele a API responde 404
      # (não 401), o que engana: parece "não existe" e é "sem permissão".
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_REPO=GhisoOF/stoat_bot
      - GITHUB_BRANCH=main

      # ── Busca web (SearXNG) ──
      - SEARXNG_URL=http://localhost:8080
      - SEARXNG_IDIOMA=pt-BR

      # ── Ferramentas ──
      - MAX_VOLTAS_FERRAMENTA=5
      - CALC_TIMEOUT_MS=5000
      # - FERRAMENTAS_OFF=calcular       # desliga ferramentas específicas
      - RSS_FEEDS=                       # feeds padrão p/ "resuma as notícias"

      # ── Segurança (recomendado, já que a porta fica exposta) ──
      # - IA_CHAVE=uma-chave-secreta     # exige header x-chave; use a MESMA no bot (IA_SERVICO_CHAVE)

      # ── DNS de emergência ──
      # Se o /etc/resolv.conf do container ficar sem `nameserver` (acontece),
      # o serviço passa a resolver nomes por dentro, com estes servidores, em
      # vez de ficar mudo. Só entra em ação quando o DNS do sistema falha.
      #
      # A ORDEM importa. O 100.100.100.100 é o MagicDNS do Tailscale: como
      # este container usa a rede do host, ele alcança esse endereço, e é o
      # único que resolve os nomes internos `*.ts.net`. Os públicos vêm depois
      # como rede de segurança, para o caso de o Tailscale estar fora do ar.
      #
      # Se esta máquina não usar Tailscale, pode deixar só os públicos.
      # Use `off` para desligar a rede de segurança por completo.
      - DNS_FALLBACK=100.100.100.100,1.1.1.1,8.8.8.8

      - TZ=Europe/Madrid
