# ══════════════════════════════════════════════════════════
#  docker-compose.yml — judy-ia na máquina Gentoo
#
#  VERSIONADO de propósito: este arquivo também vivia só no disco e sumia
#  a cada deploy. Segredos NÃO ficam aqui — moram no `.env` ao lado, que o
#  deploy preserva (ver deploy-stoat.sh).
#
#  O llama-swap NÃO está aqui: ele roda em ~/judy-llm com o próprio
#  compose, porque tem ciclo de vida independente (modelos de 13 GB não
#  devem ser reiniciados junto com o serviço de ferramentas).
# ══════════════════════════════════════════════════════════
services:
  judy-ia:
    build: .
    container_name: judy-ia
    restart: unless-stopped
    ports: ["8090:8090"]
    env_file: .env          # IA_CHAVE, LLM_URL, LLM_MODEL, CODIGO_DIR, GITHUB_TOKEN
    environment:
      - PORTA=8090
      - TZ=Europe/Madrid
    volumes:
      # ── O código que a Judy lê, sem token e sem rede ──
      # `:ro` — ela LÊ o repositório; escrever nele nunca fez parte do trato.
      - /home/ghiso/Downloads/github:/repo:ro
