# ══════════════════════════════════════════════════════════
#  SearXNG — configuração mínima para uso como API pelo Cobaia
#
#  O essencial aqui é `search.formats` incluir `json` — sem isso,
#  /search?format=json devolve 403 Forbidden.
#
#  O `secret_key` NÃO fica aqui (31 out 2026): este arquivo é público e o
#  segredo era o mesmo para todo mundo. Ele vem de SEARXNG_SECRET no .env
#  (o SearXNG lê essa variável por cima do `server.secret_key`); gere com:
#       openssl rand -hex 32
# ══════════════════════════════════════════════════════════

use_default_settings: true

general:
  instance_name: "Cobaia Search"
  # não expõe estatísticas/infos públicas
  enable_metrics: false

server:
  # secret_key: vem de SEARXNG_SECRET (docker-compose.yml + .env)
  # POST reduz a chance de ser bloqueado por alguns motores
  method: "POST"
  limiter: false            # sem rate-limit interno (uso privado)
  image_proxy: false

search:
  # ⬇️ ISTO habilita a API JSON que o bot consome
  formats:
    - html
    - json
  # idioma padrão das buscas
  default_lang: "pt-BR"
  # busca segura moderada por padrão
  safe_search: 1
  autocomplete: ""

# (31 out 2026) sem `redis:` — o compose nunca teve esse serviço e o limiter
# (o único que o usa) está desligado; o SearXNG só tentava conectar à toa.

ui:
  static_use_hash: true

# Você pode desabilitar motores pesados/instáveis aqui se quiser.
# Por padrão o SearXNG já vem com um conjunto amplo (Google, DuckDuckGo,
# Bing, Wikipedia, etc.). Para uso leve no A7, o padrão funciona bem.
