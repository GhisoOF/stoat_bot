# ══════════════════════════════════════════════════════════
#  [LEGADO] Stack de IA para rodar TUDO no próprio A7
#
#  ⚠️ Você NÃO usa mais isto. Hoje o Ollama roda na máquina Void (RX 9060 XT)
#     e o bot aponta para ela via Tailscale. Este arquivo ficou só como
#     referência histórica, caso um dia queira rodar a IA no próprio A7.
#
#  Para o setup atual, veja:
#   • ia-stack/docker-compose.searxng-only.yml  (SearXNG na máquina forte)
#   • README-ia.md, seção "Servidor de IA em outra máquina"
# ══════════════════════════════════════════════════════════
#
#  Stack de IA LOCAL para o Cobaia — 100% privada, sem chaves externas
#
#  Serviços:
#   • ollama   :11434  → roda o LLM (Qwen3 0.6B para começar)
#   • searxng  :8080   → metabusca privada (devolve JSON)
#   • redis            → cache do SearXNG (efêmero)
#
#  Ajustado para o Aocwei A7 (Celeron N5095, 8 GB):
#   • Ollama limitado a 2 dos 4 núcleos (sobram 2 p/ o bot e o sistema)
#   • Modelo descarregado da RAM após ociosidade (OLLAMA_KEEP_ALIVE)
#   • Sem GPU — inferência 100% em CPU
#
#  Suba com:  docker compose up -d
#  Depois puxe o modelo:  (ver README-ia.md)
# ══════════════════════════════════════════════════════════

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama          # os modelos baixados ficam aqui
    environment:
      # Descarrega o modelo da RAM após 5 min ocioso (libera memória no A7)
      - OLLAMA_KEEP_ALIVE=5m
      # No máximo 1 modelo carregado e 1 requisição por vez (protege a RAM)
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      # Threads de inferência = 2 (metade dos núcleos)
      - OLLAMA_NUM_THREAD=2
    deploy:
      resources:
        limits:
          cpus: "2.0"        # usa no máximo 2 dos 4 núcleos
          memory: 3g         # teto de RAM (evita esmagar o resto do sistema)

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw            # nosso settings.yml (JSON habilitado)
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  redis:
    image: redis:alpine
    container_name: searxng-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no    # cache efêmero, sem persistência
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m

volumes:
  ollama_models:
