healthCheckTimeout: 300

models:
  # Principal: conversa, ferramentas. GPU.
  "lfm2.5-8b-a1b":
    cmd: >
      /usr/local/bin/llama-server --port ${PORT}
      -m /models/LFM2.5-8B-A1B-Q4_K_M.gguf
      -c 32768 -ngl 99 --jinja --flash-attn on
      --parallel 2
    ttl: 3600

  # Leve: decisões, memória, papo curto. GPU também — era ele na CPU a 112s.
  "lfm2.5-2.6b":
    cmd: >
      /usr/local/bin/llama-server --port ${PORT}
      -m /models/LFM2.5-2.6B-QAD-Q4_0.gguf
      -c 16384 -ngl 99 --jinja --flash-attn on --parallel 2
    ttl: 3600

  # ATENÇÃO: este aponta para o MESMO arquivo do lfm2.5-8b-a1b. Não é um
  # modelo "pensante" diferente — é a mesma coisa com outro nome. Na
  # avaliação os dois deram respostas idênticas, palavra por palavra. Enquanto
  # `OLLAMA_MODEL_CODIGO` apontar para cá, o bot paga uma troca de modelo
  # (~3,5s) para carregar bytes que já estavam na placa.
  "lfm2.5-8b-think":
    cmd: >
      /usr/local/bin/llama-server --port ${PORT}
      -m /models/LFM2.5-8B-A1B-Q4_K_M.gguf
      -c 32768 -ngl 99 --jinja --flash-attn on
    ttl: 600

  "lfm2.5-vl-3b":
    cmd: >
      /usr/local/bin/llama-server --port ${PORT}
      -m /models/LFM2.5-VL-3B-Q4_K_M.gguf
      --mmproj /models/mmproj-LFM2.5-VL-3B-F16.gguf
      -c 8192 -ngl 99 --jinja --flash-attn on
    ttl: 600

  "qwen3.8-27b":
    cmd: >
      /usr/local/bin/llama-server --port ${PORT}
      -m /models/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-Q3_K_P.gguf
      --spec-type draft-mtp --spec-draft-n-max 3 --spec-draft-p-min 0
      -c 8192 -ngl 99 --flash-attn on --no-mmap
      --jinja --chat-template-kwargs '{"enable_thinking":false}'
      --temp 0.7 --top-p 0.80 --top-k 20 --min-p 0
      --presence-penalty 1.5 --repeat-penalty 1.0
    ttl: 300

  # ══════════════════════════════════════════════════════
  #  CANDIDATOS — em avaliação. Apague o que perder.
  # ══════════════════════════════════════════════════════

  # Qwythos 9B v2 (Qwen3.5 uncensored + traces Mythos/Fable).
  # Function calling nativo e contexto de 1M via YaRN; aqui em 32k, porque
  # 1M alocaria um KV cache que não cabe nesta placa.
  # Amostragem conforme o card do modelo.
  "qwythos-9b-v2":
    cmd: >
      /usr/local/bin/llama-server --port ${PORT}
      -m /models/Qwythos-9B-v2-Q4_K_M.gguf
      --mmproj /models/mmproj-Qwythos-9B-v2-BF16.gguf
      -c 32768 -ngl 99 --jinja --flash-attn on
      --temp 0.6 --top-p 0.95 --top-k 20 --repeat-penalty 1.05
    ttl: 300

  # O MESMO modelo com o raciocínio desligado. É modelo de reasoning, e o
  # <think> é tempo pago que o usuário não vê — vale medir os dois.
  "qwythos-9b-v2-rapido":
    cmd: >
      /usr/local/bin/llama-server --port ${PORT}
      -m /models/Qwythos-9B-v2-Q4_K_M.gguf
      -c 32768 -ngl 99 --jinja --flash-attn on
      --chat-template-kwargs '{"enable_thinking":false}'
      --temp 0.6 --top-p 0.95 --top-k 20 --repeat-penalty 1.05
    ttl: 300

  # Gemma 4 12B QAT (Google DeepMind, quant do unsloth), com o drafter MTP
  # que veio no repo. Gemma 4 é modelo de raciocínio: sem `enable_thinking:
  # false`, a resposta vai para reasoning_content e `content` volta vazio.
  "gemma-4-12b-qat":
    cmd: >
      /usr/local/bin/llama-server --port ${PORT}
      -m /models/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
      --mmproj /models/mmproj-F16.gguf
      --model-draft /models/mtp-gemma-4-12B-it-Q4_0.gguf
      --spec-type draft-mtp --spec-draft-n-max 4
      -c 16384 -ngl 99 --jinja --flash-attn on
      --chat-template-kwargs '{"enable_thinking":false}'
    ttl: 300

  "qwen3.8-9b-distill":
    cmd: >
      /usr/local/bin/llama-server --port ${PORT}
      -m /models/Qwen3.8-9B-Q4_K_M.gguf
      -c 32768 -ngl 99 --jinja --flash-attn on
    ttl: 300

  # Candidato a DECISAO: 1,3 GB cabe junto dos residentes.
  "qwen3.8-2b-distill":
    cmd: >
      /usr/local/bin/llama-server --port ${PORT}
      -m /models/Qwen3.8-2B-Q4_K_M.gguf
      -c 16384 -ngl 99 --jinja --flash-attn on --parallel 2
    ttl: 3600

  # Candidato a CODIGO — mesma família do `ornith:9b` que está no compose.
  "ornith-1.5-9b":
    cmd: >
      /usr/local/bin/llama-server --port ${PORT}
      -m /models/Ornith-1.5-9B-OBLITERATED-Q4_K_M.gguf
      -c 32768 -ngl 99 --jinja --flash-attn on
    ttl: 300

  # Mesma linhagem do qwen3.8-27b atual, em tamanho utilizável.
  "gemma-4-e4b-uncensored":
    cmd: >
      /usr/local/bin/llama-server --port ${PORT}
      -m /models/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf
      -c 16384 -ngl 99 --jinja --flash-attn on
      --chat-template-kwargs '{"enable_thinking":false}'
    ttl: 300

  # Finetune de terceiro, não verificado. 7,4 GB — o maior dos leves.
  "gemma-4-12b-agentic":
    cmd: >
      /usr/local/bin/llama-server --port ${PORT}
      -m /models/gemma4-v2-Q4_K_M.gguf
      -c 16384 -ngl 99 --jinja --flash-attn on
      --chat-template-kwargs '{"enable_thinking":false}'
    ttl: 300

# ── Orçamento de VRAM (16 GB, ~2,5 GB do desktop = ~13,5 GB úteis) ──
#   8b-a1b   ~5,8 GB  ┐ sempre carregados: são 95% das mensagens
#   2.6b     ~1,9 GB  ┘ ≈ 7,7 GB
#   sobram   ~5,8 GB    → think (~5,3 GB) OU vl-3b (~2,4 GB), um por vez
groups:
  "residentes":
    swap: false
    exclusive: false
    members: ["lfm2.5-8b-a1b", "lfm2.5-2.6b"]

  "sob-demanda":
    swap: true          # entre si trocam: não cabem os dois com os residentes
    exclusive: false    # mas não derrubam os residentes
    members: ["lfm2.5-8b-think", "lfm2.5-vl-3b"]

  "pesados":
    swap: true
    exclusive: true     # 13 GB não convivem com nada
    members: ["qwen3.8-27b"]

  # Enquanto durar a avaliação: cada candidato mede SOZINHO, sem dividir a
  # placa com ninguém — é a única forma de comparar tempos de forma honesta.
  # O preço é que o bot fica lento durante os testes, porque os residentes
  # são descarregados e recarregados a cada troca.
  # Terminada a escolha: apague este grupo e os perdedores, e promova o
  # vencedor para "residentes".
  "candidatos":
    swap: true
    exclusive: true
    members:
      - "qwythos-9b-v2"
      - "qwythos-9b-v2-rapido"
      - "gemma-4-12b-qat"
      - "qwen3.8-9b-distill"
      - "qwen3.8-2b-distill"
      - "ornith-1.5-9b"
      - "gemma-4-e4b-uncensored"
      - "gemma-4-12b-agentic"
