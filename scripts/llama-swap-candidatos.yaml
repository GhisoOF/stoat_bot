# ══════════════════════════════════════════════════════════
#  Entradas para avaliação — cole no `models:` do config.yaml
#  e adicione o grupo "candidatos" ao final, junto dos outros.
#
#  Todos usam as mesmas flags dos seus modelos atuais. As diferenças estão
#  comentadas caso a caso.
#
#  ttl: 300 de propósito — são para testar, não para ficar ocupando placa.
# ══════════════════════════════════════════════════════════

  # ── Qwythos 9B v2 (Qwen3.5 uncensored + traces Mythos/Fable) ──
  #  Function calling nativo no padrão Qwen3.5 e contexto de 1M via YaRN.
  #  Aqui fica em 32k: 1M de contexto alocaria KV cache que não cabe.
  #  Amostragem conforme o card do modelo.
  "qwythos-9b-v2":
    cmd: >
      /usr/local/bin/llama-server --port ${PORT}
      -m /models/Qwythos-9B-v2-Q4_K_M.gguf
      --mmproj /models/mmproj-Qwythos-9B-v2-BF16.gguf
      -c 32768 -ngl 99 --jinja --flash-attn on
      --temp 0.6 --top-p 0.95 --top-k 20 --repeat-penalty 1.05
    ttl: 300

  # O MESMO modelo com o raciocínio desligado. Vale medir os dois: ele é um
  # modelo de reasoning, e o <think> é tempo pago que o usuário não vê.
  # Se o template recusar o kwarg, o llama-server avisa no log — aí remova.
  "qwythos-9b-v2-rapido":
    cmd: >
      /usr/local/bin/llama-server --port ${PORT}
      -m /models/Qwythos-9B-v2-Q4_K_M.gguf
      -c 32768 -ngl 99 --jinja --flash-attn on
      --chat-template-kwargs '{"enable_thinking":false}'
      --temp 0.6 --top-p 0.95 --top-k 20 --repeat-penalty 1.05
    ttl: 300

  # ── Gemma 4 12B QAT (Google DeepMind, quant do unsloth) ──
  #  Traz drafter MTP próprio: decodificação especulativa de graça.
  #  Gemma 4 é modelo de raciocínio — sem o kwarg, a resposta vai para
  #  reasoning_content e `content` volta vazio.
  "gemma-4-12b-qat":
    cmd: >
      /usr/local/bin/llama-server --port ${PORT}
      -m /models/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
      --mmproj /models/mmproj-F16.gguf
      --model-draft /models/mtp-gemma-4-12B-it-Q4_0.gguf
      --spec-type draft-mtp --spec-draft-n-max 4
      -c 16384 -ngl 99 --jinja --flash-attn on
      --chat-template-kwargs '{"enable_thinking":false}'
    ttl: 300

  # ── Qwen3.8 9B Distill ──
  "qwen3.8-9b-distill":
    cmd: >
      /usr/local/bin/llama-server --port ${PORT}
      -m /models/Qwen3.8-9B-Q4_K_M.gguf
      -c 32768 -ngl 99 --jinja --flash-attn on
    ttl: 300

  # ── Qwen3.8 2B Distill — candidato a DECISAO (só JSON curto) ──
  #  1,3 GB: cabe junto dos residentes sem brigar por espaço.
  "qwen3.8-2b-distill":
    cmd: >
      /usr/local/bin/llama-server --port ${PORT}
      -m /models/Qwen3.8-2B-Q4_K_M.gguf
      -c 16384 -ngl 99 --jinja --flash-attn on --parallel 2
    ttl: 3600

  # ── Ornith 1.5 9B — candidato a CODIGO ──
  #  Mesma família do `ornith:9b` que já está no compose do bot.
  "ornith-1.5-9b":
    cmd: >
      /usr/local/bin/llama-server --port ${PORT}
      -m /models/Ornith-1.5-9B-OBLITERATED-Q4_K_M.gguf
      --mmproj /models/mmproj-Qwythos-9B-v2-BF16.gguf
      -c 32768 -ngl 99 --jinja --flash-attn on
    ttl: 300

  # ── Gemma 4 E4B uncensored (HauhauCS) ──
  #  Mesma linhagem do seu qwen3.8-27b atual, em tamanho utilizável.
  "gemma-4-e4b-uncensored":
    cmd: >
      /usr/local/bin/llama-server --port ${PORT}
      -m /models/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf
      -c 16384 -ngl 99 --jinja --flash-attn on
      --chat-template-kwargs '{"enable_thinking":false}'
    ttl: 300

  # ── Gemma 4 12B "agentic" (finetune de terceiro, não verificado) ──
  #  7,4 GB — o maior dos candidatos leves.
  "gemma-4-12b-agentic":
    cmd: >
      /usr/local/bin/llama-server --port ${PORT}
      -m /models/gemma4-v2-Q4_K_M.gguf
      -c 16384 -ngl 99 --jinja --flash-attn on
      --chat-template-kwargs '{"enable_thinking":false}'
    ttl: 300


# ══════════════════════════════════════════════════════════
#  E no bloco `groups:`, adicione:
#
#  Durante a avaliação, `exclusive: true` é o que você quer: cada candidato
#  mede sozinho, sem dividir a placa. O preço é que o bot fica lento
#  enquanto você testa, porque os residentes são descarregados e recarregados.
#  Terminada a escolha, apague o grupo inteiro e promova o vencedor para
#  "residentes".
# ══════════════════════════════════════════════════════════
#
#  "candidatos":
#    swap: true
#    exclusive: true
#    members:
#      - "qwythos-9b-v2"
#      - "qwythos-9b-v2-rapido"
#      - "gemma-4-12b-qat"
#      - "qwen3.8-9b-distill"
#      - "qwen3.8-2b-distill"
#      - "ornith-1.5-9b"
#      - "gemma-4-e4b-uncensored"
#      - "gemma-4-12b-agentic"
